spring.application.name=ledger-service

spring.datasource.url=jdbc:postgresql://localhost:5433/ledgerflow_ledger
spring.datasource.username=ledgerflow
spring.datasource.password=ledgerflow

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=ledger-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

server.port=8081